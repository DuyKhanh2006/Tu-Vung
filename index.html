<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Nhật - Minna No Nihongo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
        }

        /* 3D Flip Card Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        
        .flashcard.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            background-color: white;
            padding: 2rem;
            text-align: center;
            border: 2px solid transparent;
        }

        .card-front {
            background: linear-gradient(to bottom right, #ffffff, #f8fafc);
            border-color: #e2e8f0;
        }
        
        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            border-color: #c7d2fe;
        }

        /* No text selection on double click */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Toast Animation */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) translateX(-50%); }
            to { opacity: 1; transform: translateY(0) translateX(-50%); }
        }
        .toast {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-10">

    <nav class="bg-white shadow-sm mb-6 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4">
            <div class="flex justify-center space-x-8">
                <button id="tab-learn" onclick="switchTab('learn')" class="border-b-4 border-indigo-600 text-indigo-600 py-4 px-2 font-semibold text-sm sm:text-base transition-colors">
                    Học Từ Vựng
                </button>
                <button id="tab-import" onclick="switchTab('import')" class="border-b-4 border-transparent text-slate-500 hover:text-slate-700 py-4 px-2 font-semibold text-sm sm:text-base transition-colors">
                    Thêm Bài Học (Import)
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-4">
        
        <div id="view-learn" class="block">
            <!-- Top Controls -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="w-full sm:w-auto">
                    <label for="lesson-select" class="block text-sm font-medium text-slate-500 mb-1">Chọn bài học:</label>
                    <select id="lesson-select" onchange="changeLesson()" class="w-full sm:w-64 bg-slate-50 border border-slate-200 text-slate-800 text-base rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 outline-none font-medium">
                        <!-- Options injected by JS -->
                    </select>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-between">
                    <div class="text-sm font-medium text-slate-500" id="progress-text">0 / 0</div>
                    <button onclick="shuffleCards()" class="flex items-center justify-center gap-1 py-2 px-4 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg font-medium transition-colors text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                        </svg>
                        Trộn thẻ
                    </button>
                </div>
            </div>

            <!-- Flashcard -->
            <div class="perspective-1000 w-full h-80 sm:h-96 mb-6 flashcard no-select" id="flashcard" onclick="flipCard()">
                <div class="card-inner w-full h-full">
                    <!-- Front (Japanese) -->
                    <div class="card-face card-front">
                        <div class="text-sm font-semibold text-indigo-500 tracking-wider uppercase mb-4 opacity-70">Mặt trước - Tiếng Nhật</div>
                        <h2 id="card-jp" class="text-5xl sm:text-6xl font-bold text-slate-800 mb-4"></h2>
                        <p id="card-kanji" class="text-2xl sm:text-3xl text-slate-600 font-medium"></p>
                    </div>
                    <!-- Back (Vietnamese) -->
                    <div class="card-face card-back">
                        <div class="text-sm font-semibold text-indigo-500 tracking-wider uppercase mb-4 opacity-70">Mặt sau - Tiếng Việt</div>
                        <h2 id="card-vn" class="text-3xl sm:text-4xl font-bold text-indigo-900 leading-tight"></h2>
                    </div>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="prevCard()" class="flex items-center justify-center gap-2 py-4 px-4 bg-white border-2 border-slate-200 hover:bg-slate-50 hover:border-slate-300 text-slate-700 rounded-2xl font-bold text-lg transition-all shadow-sm active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    Quay lại
                </button>
                <button onclick="nextCard()" class="flex items-center justify-center gap-2 py-4 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-lg transition-all shadow-md shadow-indigo-200 active:scale-95">
                    Tiếp theo
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="view-import" class="hidden">
            <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-100">
                <h2 class="text-2xl font-bold text-slate-800 mb-2">Thêm Bài Học Mới</h2>
                <p class="text-slate-500 mb-6 text-sm">Copy văn bản từ file PDF và dán vào đây để tạo Flashcard tự động.</p>
                
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Tên bài học (VD: Bài 6)</label>
                    <input type="text" id="import-title" placeholder="Nhập tên bài học..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2 flex justify-between">
                        <span>Danh sách từ vựng</span>
                    </label>
                    <div class="text-xs text-slate-500 mb-2 p-3 bg-blue-50 text-blue-800 rounded-lg border border-blue-100">
                        <strong>Mẹo định dạng:</strong> Hệ thống tự động phân tích chữ tiếng Nhật và tiếng Việt. Cứ copy thẳng từ PDF (Mỗi từ 1 dòng).<br>
                        <em>Ví dụ:</em><br>
                        252. たべます 食べます ăn<br>
                        253. のみます 飲みます uống
                    </div>
                    <textarea id="import-text" rows="8" placeholder="Dán nội dung vào đây..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all font-mono text-sm leading-relaxed"></textarea>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 mt-6">
                    <button onclick="processImport()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-md shadow-emerald-200">
                        Tạo bài học
                    </button>
                    <button onclick="clearCustomLessons()" class="w-full sm:w-auto bg-red-100 hover:bg-red-200 text-red-700 font-bold py-3 px-6 rounded-xl transition-colors">
                        Xóa dữ liệu tự thêm
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 left-1/2 z-50 pointer-events-none"></div>

    <script>
        // --- 1. HARDCODED DATA (Lessons 1 to 5) ---
        // Contains around 20-30 essential words per lesson to get started instantly.
        const defaultLessons = {

                { jp: "わたし", kanji: "私", vn: "Tôi" },

                { jp: "にほん", kanji: "日本", vn: "Nhật Bản" }
            ],
            "Bài 2": [

                { jp: "それ", kanji: "", vn: "Đó, cái đó (gần người nghe)" },

                { jp: "テレビ", kanji: "", vn: "Ti vi" },
                { jp: "くるま", kanji: "車", vn: "Xe ô tô" },
                { jp: "えいご", kanji: "英語", vn: "Tiếng Anh" },

            ],
            "Bài 3": [
                { jp: "ここ", kanji: "", vn: "Chỗ này, đây" },
                { jp: "そこ", kanji: "", vn: "Chỗ đó" },
                { jp: "あそこ", kanji: "", vn: "Chỗ kia" },
                { jp: "どこ", kanji: "", vn: "Ở đâu, chỗ nào" },
                { jp: "きょうしつ", kanji: "教室", vn: "Phòng học" },
                { jp: "しょくどう", kanji: "食堂", vn: "Nhà ăn" },
                { jp: "じむしょ", kanji: "事務所", vn: "Văn phòng" },
                { jp: "かいぎしつ", kanji: "会議室", vn: "Phòng họp" },
                { jp: "うけつけ", kanji: "受付", vn: "Quầy tiếp tân" },
                { jp: "へや", kanji: "部屋", vn: "Căn phòng" },
                { jp: "トイレ", kanji: "", vn: "Nhà vệ sinh" },
                { jp: "かいだん", kanji: "階段", vn: "Cầu thang bộ" },
                { jp: "くに", kanji: "国", vn: "Đất nước" },
                { jp: "かいしゃ", kanji: "会社", vn: "Công ty" },
                { jp: "うち", kanji: "家", vn: "Nhà" },
                { jp: "くつ", kanji: "靴", vn: "Giày" },
                { jp: "いくら", kanji: "", vn: "Bao nhiêu tiền" }
            ],
            "Bài 4": [
                { jp: "おきます", kanji: "起きます", vn: "Thức dậy" },
                { jp: "ねます", kanji: "寝ます", vn: "Ngủ" },
                { jp: "はたらきます", kanji: "働きます", vn: "Làm việc" },
                { jp: "やすみます", kanji: "休みます", vn: "Nghỉ ngơi" },
                { jp: "べんきょうします", kanji: "勉強します", vn: "Học tập" },
                { jp: "おわります", kanji: "終わります", vn: "Kết thúc" },
                { jp: "デパート", kanji: "", vn: "Cửa hàng bách hóa" },
                { jp: "ぎんこう", kanji: "銀行", vn: "Ngân hàng" },
                { jp: "としょかん", kanji: "図書館", vn: "Thư viện" },
                { jp: "いま", kanji: "今", vn: "Bây giờ" },
                { jp: "ごぜん", kanji: "午前", vn: "Sáng (AM)" },
                { jp: "ごご", kanji: "午後", vn: "Chiều (PM)" },
                { jp: "あさ", kanji: "朝", vn: "Sáng" },
                { jp: "ひる", kanji: "昼", vn: "Trưa" },
                { jp: "ばん", kanji: "晩", vn: "Tối" },
                { jp: "きょう", kanji: "今日", vn: "Hôm nay" },
                { jp: "あした", kanji: "明日", vn: "Ngày mai" },
                { jp: "まいにち", kanji: "毎日", vn: "Mỗi ngày" }
            ],
            "Bài 5": [
                { jp: "いきます", kanji: "行きます", vn: "Đi" },
                { jp: "きます", kanji: "来ます", vn: "Đến" },
                { jp: "かえります", kanji: "帰ります", vn: "Về" },
                { jp: "がっこう", kanji: "学校", vn: "Trường học" },
                { jp: "スーパー", kanji: "", vn: "Siêu thị" },
                { jp: "えき", kanji: "駅", vn: "Nhà ga" },
                { jp: "ひこうき", kanji: "飛行機", vn: "Máy bay" },
                { jp: "ふね", kanji: "船", vn: "Tàu thủy" },
                { jp: "でんしゃ", kanji: "電車", vn: "Tàu điện" },
                { jp: "ちかてつ", kanji: "地下鉄", vn: "Tàu điện ngầm" },
                { jp: "じてんしゃ", kanji: "自転車", vn: "Xe đạp" },
                { jp: "あるいて", kanji: "歩いて", vn: "Đi bộ" },
                { jp: "ともだち", kanji: "友達", vn: "Bạn bè" },
                { jp: "かぞく", kanji: "家族", vn: "Gia đình" },
                { jp: "せんしゅう", kanji: "先週", vn: "Tuần trước" },
                { jp: "こんしゅう", kanji: "今週", vn: "Tuần này" },
                { jp: "らいしゅう", kanji: "来週", vn: "Tuần sau" },
                { jp: "いつ", kanji: "", vn: "Khi nào, bao giờ" }
            ]
        };

        // --- 2. STATE VARIABLES ---
        let allLessons = {};
        let currentLessonData = [];
        let currentIndex = 0;
        let isFlipped = false;

        // --- 3. INITIALIZATION ---
        function initApp() {
            loadLessons();
            populateLessonDropdown();
            if (Object.keys(allLessons).length > 0) {
                const firstLessonName = Object.keys(allLessons)[0];
                document.getElementById('lesson-select').value = firstLessonName;
                loadCardsForLesson(firstLessonName);
            }
        }

        function loadLessons() {
            // Load custom lessons from localStorage
            let customLessons = {};
            try {
                const saved = localStorage.getItem('customJapaneseLessons');
                if (saved) customLessons = JSON.parse(saved);
            } catch (e) {
                console.error("Lỗi đọc dữ liệu localStorage", e);
            }
            
            // Merge defaults and customs
            allLessons = { ...defaultLessons, ...customLessons };
        }

        function populateLessonDropdown() {
            const select = document.getElementById('lesson-select');
            select.innerHTML = '';
            
            // Populate defaults first
            const defaultKeys = Object.keys(defaultLessons);
            if (defaultKeys.length > 0) {
                const optGroup = document.createElement('optgroup');
                optGroup.label = "Bài học mặc định";
                defaultKeys.forEach(key => {
                    optGroup.innerHTML += `<option value="${key}">${key}</option>`;
                });
                select.appendChild(optGroup);
            }

            // Populate customs
            const customKeys = Object.keys(allLessons).filter(k => !defaultLessons[k]);
            if (customKeys.length > 0) {
                const optGroup = document.createElement('optgroup');
                optGroup.label = "Bài học của bạn";
                customKeys.forEach(key => {
                    optGroup.innerHTML += `<option value="${key}">${key}</option>`;
                });
                select.appendChild(optGroup);
            }
        }

        // --- 4. FLASHCARD LOGIC ---
        function changeLesson() {
            const selected = document.getElementById('lesson-select').value;
            loadCardsForLesson(selected);
        }

        function loadCardsForLesson(lessonName) {
            currentLessonData = [...allLessons[lessonName]]; // Copy array
            currentIndex = 0;
            if (isFlipped) {
                flipCard(true); // reset flip state without animation delay
            }
            renderCard();
        }

        function renderCard() {
            if (currentLessonData.length === 0) return;
            
            const card = currentLessonData[currentIndex];
            
            // If flipped, flip it back fast before changing content
            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('flipped');
                isFlipped = false;
                setTimeout(() => updateCardUI(card), 150);
            } else {
                updateCardUI(card);
            }
        }

        function updateCardUI(card) {
            document.getElementById('card-jp').textContent = card.jp || card.kanji || '';
            document.getElementById('card-kanji').textContent = (card.kanji && card.jp && card.kanji !== card.jp) ? `(${card.kanji})` : '';
            document.getElementById('card-vn').textContent = card.vn || '';
            
            document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${currentLessonData.length}`;
        }

        function flipCard(instant = false) {
            const flashcard = document.getElementById('flashcard');
            if (instant) {
                flashcard.style.transition = 'none';
                flashcard.classList.remove('flipped');
                isFlipped = false;
                // Force reflow
                void flashcard.offsetWidth;
                flashcard.style.transition = '';
            } else {
                isFlipped = !isFlipped;
                flashcard.classList.toggle('flipped');
            }
        }

        function nextCard() {
            if (currentIndex < currentLessonData.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                showToast("Bạn đã xem hết từ vựng bài này!");
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function shuffleCards() {
            for (let i = currentLessonData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentLessonData[i], currentLessonData[j]] = [currentLessonData[j], currentLessonData[i]];
            }
            currentIndex = 0;
            if (isFlipped) flipCard(true);
            renderCard();
            showToast("Đã trộn thẻ ngẫu nhiên!");
        }

        // --- 5. PARSER & IMPORT LOGIC ---
        function processImport() {
            const titleInput = document.getElementById('import-title').value.trim();
            const textInput = document.getElementById('import-text').value.trim();

            if (!titleInput) {
                showToast("Vui lòng nhập tên bài học!", true);
                return;
            }
            if (!textInput) {
                showToast("Vui lòng dán văn bản chứa từ vựng!", true);
                return;
            }

            const parsedWords = parseTextToJSON(textInput);
            
            if (parsedWords.length === 0) {
                showToast("Không tìm thấy từ vựng nào. Hãy kiểm tra lại định dạng!", true);
                return;
            }

            // Save to LocalStorage
            let customLessons = {};
            try {
                const saved = localStorage.getItem('customJapaneseLessons');
                if (saved) customLessons = JSON.parse(saved);
            } catch (e) {}

            customLessons[titleInput] = parsedWords;
            localStorage.setItem('customJapaneseLessons', JSON.stringify(customLessons));

            showToast(`Thành công! Đã thêm ${parsedWords.length} từ vào "${titleInput}"`);
            
            // Reset fields
            document.getElementById('import-title').value = '';
            document.getElementById('import-text').value = '';
            
            // Reload UI
            initApp();
            
            // Switch to Learn tab and select new lesson
            switchTab('learn');
            document.getElementById('lesson-select').value = titleInput;
            loadCardsForLesson(titleInput);
        }

        function parseTextToJSON(text) {
            const lines = text.split('\n');
            const words = [];
            
            // Regex to detect Japanese characters (Hiragana, Katakana, Kanji)
            const jpRegex = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FBF]/;

            lines.forEach(line => {
                let cleanLine = line.trim();
                if (!cleanLine) return;

                // 1. Remove numbering at start (e.g., "1.", "12.", "253.")
                cleanLine = cleanLine.replace(/^\d+[\.\s]*/, '').trim();
                
                if (!cleanLine) return;

                // 2. Try to split by tabs or multiple spaces or pipes
                let parts = cleanLine.split(/\t| {2,}|\|/);
                parts = parts.map(p => p.trim()).filter(p => p !== '');

                let jp = "";
                let kanji = "";
                let vn = "";

                if (parts.length >= 2) {
                    // Good case: clearly separated by spaces/tabs
                    // Often: [Hiragana] [Kanji] [Meaning] or [Vocab] [Meaning]
                    
                    if (parts.length === 2) {
                        jp = parts[0];
                        vn = parts[1];
                    } else if (parts.length === 3) {
                        jp = parts[0];
                        kanji = parts[1];
                        vn = parts[2];
                    } else {
                        // >= 4 parts (like [jp] [kanji] [HanViet] [vn])
                        jp = parts[0];
                        kanji = parts[1];
                        // Merge the rest as Vietnamese meaning
                        vn = parts.slice(parts.length > 3 ? 3 : 2).join(' - ');
                    }
                } else {
                    // Bad case: single string, single spaces. e.g. "わたし 私 Tôi"
                    // Strategy: Find where Japanese chars end and Latin chars begin
                    let match = cleanLine.match(/^(.*?[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FBF]+(?:\s+[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FBF]+)*)\s+(.*)$/);
                    
                    if (match && match.length >= 3) {
                        let jpPart = match[1].trim(); // "わたし 私"
                        vn = match[2].trim(); // "Tôi"
                        
                        // Split jpPart if it contains spaces
                        let subJpParts = jpPart.split(/\s+/);
                        if (subJpParts.length > 1) {
                            jp = subJpParts[0];
                            kanji = subJpParts.slice(1).join(' ');
                        } else {
                            jp = jpPart;
                        }
                    } else {
                        // Fallback: Just put the whole line as front and back
                        jp = cleanLine;
                        vn = "(Chưa tách được nghĩa)";
                    }
                }

                // Push to array if we have something
                if (jp || vn) {
                    words.push({ jp, kanji, vn });
                }
            });

            return words;
        }

        function clearCustomLessons() {
            if(confirm("Bạn có chắc chắn muốn xóa toàn bộ các bài học đã thêm? Hành động này không thể hoàn tác.")) {
                localStorage.removeItem('customJapaneseLessons');
                showToast("Đã xóa dữ liệu bài học tự thêm.");
                initApp();
            }
        }

        // --- 6. UI & HELPERS ---
        function switchTab(tab) {
            const viewLearn = document.getElementById('view-learn');
            const viewImport = document.getElementById('view-import');
            const btnLearn = document.getElementById('tab-learn');
            const btnImport = document.getElementById('tab-import');

            if (tab === 'learn') {
                viewLearn.classList.remove('hidden');
                viewImport.classList.add('hidden');
                
                btnLearn.classList.add('border-indigo-600', 'text-indigo-600');
                btnLearn.classList.remove('border-transparent', 'text-slate-500');
                
                btnImport.classList.remove('border-indigo-600', 'text-indigo-600');
                btnImport.classList.add('border-transparent', 'text-slate-500');
            } else {
                viewLearn.classList.add('hidden');
                viewImport.classList.remove('hidden');
                
                btnImport.classList.add('border-indigo-600', 'text-indigo-600');
                btnImport.classList.remove('border-transparent', 'text-slate-500');
                
                btnLearn.classList.remove('border-indigo-600', 'text-indigo-600');
                btnLearn.classList.add('border-transparent', 'text-slate-500');
            }
        }

        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            
            const toast = document.createElement('div');
            toast.className = `toast px-4 py-3 rounded-xl shadow-lg font-medium text-sm flex items-center gap-2 mb-3 transform -translate-x-1/2 ${isError ? 'bg-red-600 text-white' : 'bg-slate-800 text-white'}`;
            toast.style.left = '50%';
            
            toast.innerHTML = `
                ${isError 
                    ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>'
                }
                ${message}
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px) translateX(-50%)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('view-learn').classList.contains('hidden')) return; // Only if in Learn Tab
            
            if (e.key === 'ArrowRight') nextCard();
            else if (e.key === 'ArrowLeft') prevCard();
            else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
                flipCard();
            }
        });

        // Run Init
        window.onload = initApp;

    </script>
